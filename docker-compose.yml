# ── Elite Travel XP — Independent VPS Docker Stack ─────────────────
# Usage on VPS:
#   cp .env.production.example .env
#   docker compose up -d --build
#   docker compose exec pocketbase ./pocketbase superuser upsert "$PB_ADMIN_EMAIL" "$PB_ADMIN_PASSWORD"
#   docker compose run --rm -e PB_URL=http://pocketbase:8090 web node scripts/seed-pocketbase.mjs
#     (or seed from your laptop against https://your-domain)

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_POCKETBASE_URL: ${PUBLIC_URL:-https://travelexperiencesgroup.com}
    container_name: elite-web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_POCKETBASE_URL: ${PUBLIC_URL:-https://travelexperiencesgroup.com}
    expose:
      - "3000"
    depends_on:
      - pocketbase
    networks:
      - elite-net

  pocketbase:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elite-pocketbase
    restart: unless-stopped
    env_file: .env
    volumes:
      - pb_data:/pb/pb_data
      - ./backend/pb_migrations:/pb/pb_migrations:ro
    expose:
      - "8090"
    # Optional direct access for admin troubleshooting (comment out in strict prod)
    ports:
      - "8090:8090"
    networks:
      - elite-net

  nginx:
    image: nginx:1.27-alpine
    container_name: elite-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web
      - pocketbase
    networks:
      - elite-net

  certbot:
    image: certbot/certbot:latest
    container_name: elite-certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks:
      - elite-net

volumes:
  pb_data:
  certbot_conf:
  certbot_www:

networks:
  elite-net:
    driver: bridge
