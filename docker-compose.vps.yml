# VPS stack for Hostinger — sits behind host Nginx (ports 80/443 already used).
# Web :3200 · PocketBase :8091
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_POCKETBASE_URL: ${PUBLIC_URL:-https://tokiotours-app.com}
    container_name: elite-web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_POCKETBASE_URL: ${PUBLIC_URL:-https://tokiotours-app.com}
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL:-https://tokiotours-app.com}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_URL:-https://tokiotours-app.com}
      # Server-side admin APIs use the Docker network (not public nginx)
      POCKETBASE_INTERNAL_URL: http://pocketbase:8090
      POCKETBASE_URL: http://pocketbase:8090
    ports:
      - "3200:3000"
    volumes:
      # Persist Team Email Settings across rebuilds
      - ./config/emailConfig.json:/app/config/emailConfig.json
    depends_on:
      - pocketbase
    networks:
      - elite-net

  pocketbase:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elite-pocketbase
    restart: unless-stopped
    env_file: .env
    environment:
      # Used by backend/docker-entrypoint.sh on every container start
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-admin@tokiotours-app.com}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-EliteTravelAdmin2026!}
    volumes:
      - pb_data:/pb/pb_data
      - ./backend/pb_migrations:/pb/pb_migrations:ro
    ports:
      - "8091:8090"
    networks:
      - elite-net

volumes:
  pb_data:

networks:
  elite-net:
    driver: bridge
